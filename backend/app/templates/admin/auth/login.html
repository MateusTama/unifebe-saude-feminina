<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SaúdeFem Administração</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Segoe UI', 'system-ui', 'sans-serif'],
          },
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))',
            },
            secondary: {
              DEFAULT: 'hsl(var(--secondary))',
              foreground: 'hsl(var(--secondary-foreground))',
            },
            accent: {
              DEFAULT: 'hsl(var(--accent))',
              foreground: 'hsl(var(--accent-foreground))',
            },
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            destructive: {
              DEFAULT: 'hsl(var(--destructive))',
              foreground: 'hsl(var(--destructive-foreground))',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles & Tokens -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="min-h-screen bg-[hsl(var(--background))] flex flex-col items-center justify-center p-4 antialiased selection:bg-[hsl(var(--accent))] selection:text-[hsl(var(--accent-foreground))]">

  <div class="w-full max-w-[390px] flex flex-col items-center">

    <!-- Cabeçalho / Logo -->
    <div class="flex flex-col items-center text-center mb-6">
      <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-white shadow-sm mb-3.5" style="background-color: hsl(var(--primary));">
        <i data-lucide="heart-pulse" class="w-6 h-6 stroke-[2.2]"></i>
      </div>
      <h1 class="text-xl font-bold text-foreground tracking-tight">SaúdeFem</h1>
      <p class="text-xs text-muted-foreground font-normal mt-0.5">Painel administrativo</p>
    </div>

    <!-- Mensagens Flash -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="w-full mb-4 flex flex-col gap-2">
          {% for category, message in messages %}
            <div class="p-3 rounded-lg text-xs font-medium border flex items-center gap-2 {% if category == 'error' %}bg-red-50 text-red-700 border-red-200{% elif category == 'success' %}bg-emerald-50 text-emerald-700 border-emerald-200{% else %}bg-blue-50 text-blue-700 border-blue-200{% endif %}">
              <i data-lucide="info" class="w-4 h-4 shrink-0"></i>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Card de Login -->
    <div class="w-full bg-white border border-border rounded-2xl p-6 sm:p-7 shadow-sm">
      <form method="POST" action="{{ url_for('admin_auth.login') }}" class="flex flex-col gap-4">
        
        <!-- Campo E-mail -->
        <div class="flex flex-col gap-1.5">
          <label for="email" class="text-xs font-semibold text-foreground">E-mail</label>
          <input type="email" 
                 id="email"
                 name="email" 
                 required
                 placeholder="admin@saude.gov.br" 
                 class="w-full h-10 px-3.5 text-sm font-normal bg-white border border-input rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
        </div>

        <!-- Campo Senha -->
        <div class="flex flex-col gap-1.5">
          <label for="senha" class="text-xs font-semibold text-foreground">Senha</label>
          <input type="password" 
                 id="senha"
                 name="senha" 
                 required
                 placeholder="••••••••" 
                 class="w-full h-10 px-3.5 text-sm font-normal bg-white border border-input rounded-lg text-foreground placeholder:text-muted-foreground focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
        </div>

        <!-- Botão Entrar -->
        <button type="submit" 
                class="btn-primary w-full h-10 mt-1 inline-flex items-center justify-center rounded-lg text-sm font-medium shadow-sm transition-all">
          Entrar
        </button>

        <!-- Texto de Aviso -->
        <p class="text-[11px] text-muted-foreground text-center mt-1 font-normal">
          Acesso restrito a administradores ativos.
        </p>

      </form>
    </div>

  </div>

  <script>
    // Inicialização dos ícones Lucide
    lucide.createIcons();
  </script>
</body>
</html>
